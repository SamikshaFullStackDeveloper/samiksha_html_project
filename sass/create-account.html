<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <link rel="stylesheet" href="login_page.css"/>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-image: url(../assets/images/wall_paper.jpg);
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: rgba(255, 255, 255, 0.8);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            width: 300px;
            text-align: center;
        }

        label {
            display: inline-block;
            margin-top: 10px;
        }

        input {
            width: 100%;
            padding: 5px;
            margin-top: 2px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            border: none;
            border-radius: 4px;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }

       
    </style>
</head>

<body>
    <div class="container">
        <h1>Create an Account</h1>
        <form>
            <!--first name input -->
            <label for="Text">First Name : </label>
            <input type="text" id="First name" />
            <!-- Middle name input -->
            <label for="Text">Middle Name : </label>
            <input type="text" id="Middle Name" />
            <!-- last name input -->
            <label for="text">Last Name : </label>
            <input type="text" id="Last name" />
           <br/>
           <!-- Gender -->
            <div class="gender">
             <h3>Gender: </h3>
             <br/>
                <label for="Gender">Male </label>
                <input type="radio" name="Gender">
                <label for="Gender">Female </label>
                <input type="radio" name="Gender">
                <label for="Gender">Other </label>
                <input type="radio" name="Gender">
            </div>
            <br/>
            <!-- DOB input  -->
            <lable for="date">Date Of Birth : </lable>
            <input type="date" id="date ">
            <!-- Ph number input -->
            <label for="number">Contact Number 📞 : </label>
            <input type="number" id="Contact number" />
            <!-- Email id input -->
            <label for="Email id">Email id : </label>
            <input type="Email id" id="Email id" />
            <!-- Submit Button -->
            <button class="button" type="Submit" class="signupbtn"><a>Submit</a></button>
        </form>

    </div>
</body>

</html>
