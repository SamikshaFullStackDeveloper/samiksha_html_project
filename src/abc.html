<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevVerse – JavaScript Projects</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Orbitron', sans-serif;
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .stars {
            position: fixed;
            width: 100%;
            height: 100%;
            background: transparent url('https://www.transparenttextures.com/patterns/stardust.png') repeat;
            z-index: -1;
            opacity: 0.2;
        }

        header {
            text-align: center;
            padding: 2rem 1rem;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        header p {
            color: #ccc;
        }

        .project-grid {
            display: grid;
            gap: 2rem;
            padding: 2rem;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        }

        .card {
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid #444;
            border-radius: 16px;
            padding: 1.5rem;
            transition: transform 0.3s ease;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
        }

        .card h2 {
            margin-top: 0;
            font-size: 1.5rem;
        }

        .card p {
            color: #aaa;
        }

        .tags {
            margin: 1rem 0;
        }

        .tags span {
            display: inline-block;
            background: #00bcd4;
            color: black;
            padding: 0.3rem 0.6rem;
            border-radius: 8px;
            font-size: 0.75rem;
            margin: 0.2rem;
        }

        a {
            color: #00e5ff;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="stars"></div>

    <header>
        <h1>JavaScript Projects</h1>
        <p>"JavaScript — where logic meets magic, and every click tells a story."</p>
    </header>

    <main class="project-grid">
       
         <div class="card">
            <h2>Memory Game</h2>
            <p>A fun card-flipping game built with vanilla JS.</p>
            <div class="tags">
                <span>JavaScript</span>
                <span>HTML</span>
                <span>CSS</span>
            </div>
            <a href="https://github.com/yourusername/memory-game" target="_blank">View on GitHub</a>
        </div>

        <!-- Add more cards for other JS projects here -->
    </main>
</body>

</html>
