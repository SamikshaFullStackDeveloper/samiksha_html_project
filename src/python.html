<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Python Projects</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Orbitron', sans-serif;
            background: linear-gradient(135deg, #1f1c2c, #928DAB);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        header {
            margin-bottom: 48px;
        }

        header h1 {
            font-size: 48px;
            color: #00e5ff;
        }

        code {
            display: block;
            background-color: #3333335f;
            padding: 16px;
            border-radius: 8px;
            font-size: 16px;
            overflow-x: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

    </style>
</head>

<body>

    <header>
        <h1>Python Projects</h1>
        <code>
a = int(input("Enter your first score: "))<br/>
b = int(input("Enter your second score: "))<br/>

if a > b:<br/>
    print("a is greater")<br/>
elif b > a:<br/>
    print("b is greater")<br/>
else:<br/>
    print("Both are equal")<br/>
        </code>
    </header>

</body>

</html>
