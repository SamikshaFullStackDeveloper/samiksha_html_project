<!DOCTYPE html>
<html lang="en">
<head>
    <title>Grid</title>
    <style>
        .main-container{
            background-color: gray;
            height: 100vh;
            width: 100vw;
        }
        .first-row{
            background-color: lightblue;
            height: 33%;
            width: 100%;
        }
        .second-row{
            background-color: lightpink;
            height: 34%;
            width: 100%;
        }
        .third-row{
            background-color: teal;
            height: 33%;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="main-container">
       <div class="first-row"></div> 
       <div class="second-row"></div>
       <div class="third-row"></div>
    </div>
</body>
</html>
