<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Title -->
    <title>flex</title>
    <!-- Css -->
    <style>
        /* Internal Styling */
        /* Container */
        .container {
            height: 100vh;
            width: 100vw;
            background-color: gray;
            display: flex;
            flex-direction: row;

        }

        /* first-division */
        .first-division {
            height: 100%;
            width: 25%;
            background-color: violet;
        }

        /* second-division */
        .second-division {
            height: 100%;
            width: 25%;
        }

        /* second-division-box-one */
        .second-division-box-one {
            height: 30%;
            width: 100%;
            background-color: lightsalmon;
        }

        /* second-division-box-two */
        .second-division-box-two {
            height: 40%;
            width: 100%;
            background-color: lightskyblue;
        }

        /* second-division-box-three */
        .second-division-box-three {
            height: 30%;
            width: 100%;
            background-color: lightseagreen;
        }

        /* third-division */
        .third-division {
            height: 100%;
            width: 25%;
        }

        /* third-division-box-one */
        .third-division-box-one {
            height: 70%;
            width: 100%;
            background-color: lightskyblue;
        }

        /* third-division-box-two */
        .third-division-box-two {
            height: 30%;
            width: 100%;
            background-color: lightseagreen;
        }

        /* fourth-division */
        .fourth-division {
            height: 100%;
            width: 25%;
        }

        /* fourth-division-box-one */
        .fourth-division-box-one {
            height: 40%;
            width: 100%;
            background-color: lightpink
        }

        /* fourth-division-box-two */
        .fourth-division-box-two {
            height: 60%;
            width: 100%;
            background-color: lightslategray
        }
    </style>
</head>

<body>
    <!-- Main Container -->
    <div class="container">
        <!-- First Division -->
        <div class="first-division"></div>
        <!-- Second Division -->
        <div class="second-division">
            <div class="second-division-box-one"></div>
            <div class="second-division-box-two"></div>
            <div class="second-division-box-three"></div>
        </div>
        <!-- Third Division -->
        <div class="third-division">
            <div class="third-division-box-one"></div>
            <div class="third-division-box-two"></div>
        </div>
        <!-- Fourth Division -->
        <div class="fourth-division">
            <div class="fourth-division-box-one"></div>
            <div class="fourth-division-box-two"></div>
        </div>
    </div>
</body>

</html>
