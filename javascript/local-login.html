<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login-Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-image: url(../assets/images/wall_paper.jpg);
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: rgba(255, 255, 255, 0.8);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            width: 300px;
            text-align: center;
        }

        input {
            width: 90%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            border: none;
            border-radius: 4px;
            color: white;
            cursor: pointer;
        }
    </style>
    <script>

        let counter = 0;
        // store counter function
        function storeCounter(value) {
            localStorage.setItem("counter", value);
        }

        // get counter function
        function getCounter() {
            return localStorage.getItem("counter") ?
                localStorage.getItem("counter") : 0;
        }

        // login function
        function login() {
            let username = document.getElementById("username").value;
            let password = document.getElementById("password").value;

            let storeCounter = getCounter();

            // processing
            if (storeCounter >= 3) {
                alert("You have reached  the number of attempts");
                // hidden
                let username = document.getElementById("username").hidden = true;
                let password = document.getElementById("password").hidden = true;
            }
            // condition name and password equal or not
            else {
                if (username == "admin" && password == "technology") {
                    alert("Login Successfull");
                } else {
                    alert("Invalid Username or Password Please try again");
                }

                // storeCounter Increament
                storeCounter++;
                storeCounter = localStorage.setItem("counter", storeCounter);


            }
        }

    </script>

</head>

<body>
    <div class="container">
        <h1>Login</h1>

        <br />
        <!-- first input -->
        <label for="text" id="display"></label>
        <input type="text" id="username" placeholder="User Name">
        <br />
        <br />
        <!-- second input -->
        <label for="password"></label>
        <input type="password" id="password" placeholder="Password">
        <br />
        <br />
        <!-- button -->
        <button type="button" onclick="login()">Login</button>
    </div>
</body>

</html>
