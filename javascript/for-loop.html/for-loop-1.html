<body>
    <div class="container">
        <h1>For Loop Javascript</h1>
        <input type="number" id="input">
        <button onclick="forloop1()">submit</button>
        <div class="display" id="display"></div>

    </div>
    <!-- table -->
    <script>
        function forloop() {
            const num = document.getElementById("input").value

            for (input = 1; input <= 10; input++) {
                {
                    console.log(input);
                    document.getElementById("display").innerHTML += num + "x" + input + " = " + num * input + "<br/>";

                }
            }
        }
    </script>

    <!-- even-odd -->
    
    <script>
        function forloop1() {
            const num = document.getElementById("input").value

            for (let input = num; input <= 5; input++) {
                {
                    console.log(input);
                    if (input % 2 == 0) {
                        document.getElementById("display").innerHTML += `${ input } is even  "<br/>"`;
                    }
                    else {
                        document.getElementById("display").innerHTML += `${ input } is odd "<br/>"`;
                    }
                }
            }
        }
    </script>

<!-- print a right angle triangle pattern -->
<script>
    function forloop6(){
        const num = document.getElementById("input").value;
