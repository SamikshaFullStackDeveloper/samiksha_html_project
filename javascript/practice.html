<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display</title>
    <style>
        .container {
            height: 35vh;
            width: 15vw;
            background-color: gray;
            padding: 20px;
            margin: 0 auto;
            margin-bottom: 300px;
        }

        .Display {
            height: 10vh;
            width: 100%;
            background-color: darkgray;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            color: white;
        }

        .input-group {
            height: 5vh;
            width: 100%;
            margin-top: 10px;
        }

        .btn {
            height: 5vh;
            width: 100%;
            background-color: darkgray;
            margin: 5px 0;
        }
    </style>
    <script>
        function clickFunction() {
            let x = document.getElementById('input-one').value;
            let y = document.getElementById('input-two').value;
            let z = Number(x) + Number(y);
            document.getElementById('Display').innerHTML = z;
        }

        function clearFunction() {
            document.getElementById('Display').innerHTML = "";
        }
    </script>
</head>

<body>
    <div class="container">
        <div class="Display" id="Display"></div>
        <form onsubmit="return false;">
            <div class="input-group">
                <input type="text" id="input-one" placeholder="input one">
            </div>
            <div class="input-group">
                <input type="text" id="input-two" placeholder="input two">
            </div>
            <button type="button" class="btn" onclick="clickFunction()">Calculate</button>
            <button type="button" class="btn" onclick="clearFunction()">Clear</button>
        </form>
    </div>
</body>

</html>
