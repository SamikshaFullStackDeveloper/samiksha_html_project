<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Donation Eligibility</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background: url('https://source.unsplash.com/1600x900/?hospital,blood') no-repeat center center/cover;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            width: 350px;
        }
        h1 {
            margin-bottom: 20px;
            color: #d32f2f;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 18px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #388e3c;
            color: white;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background: #2e7d32;
        }
        #result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Blood Donation</h1>
        <input type="number" id="age" placeholder="Enter your age" min="1">
        <input type="number" id="weight" placeholder="Enter your weight (kg)" min="1">
        <button onclick="checkEligibility()">Check Eligibility</button>
        <p id="result"></p>
    </div>

    <script>
        function checkEligibility() {
            let age = document.getElementById("age").value;
            let weight = document.getElementById("weight").value;
            let result = document.getElementById("result");

            if (age >= 18 && weight > 45) {
                result.innerHTML = "✅ You are Eligible to Donate Blood!";
                result.style.color = "green";
            } else {
                result.innerHTML = "❌ You are not Eligible to Donate Blood.";
                result.style.color = "red";
            }
        }
    </script>
</body>
</html>
