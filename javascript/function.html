<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>function</title>
    <style>
        /* Main Container */
        .main-container {
            height: 80vh;
            width: 50vw;
            background-color: #BCF2F6;
            display: flex;
            flex-direction: column;
            justify-content: center;
            margin-left: 350px;
            margin-top: 80px;

            
        }

        /* First Container */
        .first-container {
            height: 40%;
            width:80%;
            background-color: #FFFBE6;
        }

        #display {
            text-align: center;
            font-size: 20px;
           
        }

        /* Second Container */
        .second-container {
            height: 30%;
            width: 50%;
            display: flex;
           flex-direction: row;
            
        }
        button{
            height:20%;
            width: 60%;
            background-color: #8FD14F;
           gap: 20px;

        }
    </style>
</head>

<body>
    <!-- Main Container -->
    <div class="main-container">
        <!-- First Container -->
        <div class="first-container">
            <input type="text" id="display" placeholder="Display" readonly>
        </div>
        <!-- Second Container -->
        <div class="second-container">
            <button type="button">Hello</button>
            <button type="button">Bye</button>
        </div>
    </div>

</body>

</html>
