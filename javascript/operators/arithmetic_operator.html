<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main-container {
            height: 60vh;
            width: 30vw;
            background-color: lightgray;
            text-align: center;
            padding: 5%;
            margin-top: 50px;
            margin-left: 400px;
        }

        button {
            background-color: gray;
            padding: 10px;
            border-radius: 10px;
            width: 90%;
            height: 10%;
            font-size: 20px;
        }

        input {
            width: 90%;
            height: 10%;
            padding: 10px;
            border-radius: 10px;
            font-size: 20px;
        }

        #demo {
            width: 92%;
            height: 20%;
            padding: 10px;
            border-radius: 20px;
            border-color: black;
            font-size: 20px;
            background-color: beige;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="main-container">
        <div id="demo"></div>
        <br />
        <!-- first input -->
        <label for="number"></label>
        <input type="number" id="Input-one" placeholder="Enter first number">
        <br />
        <br />
        <!-- second input -->
        <label for="number"></label>
        <input type="number" id="Input-two" placeholder="Enter second number">
        <br />
        <br />
        <!-- button -->
        <button type="button" onclick="add()">Add</button>
    </div>
    <script>
        function add() {
            let x = Number(document.getElementById('Input-one').value);
            let y = Number(document.getElementById('Input-two').value);

            // output on console
            console.log(x + y);
            alert(x + y);
            document.getElementById("demo").innerHTML = 'Add' + ':' + Number(x + y);
        }
    </script>
</body>

</html>
