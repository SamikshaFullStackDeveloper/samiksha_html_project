<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main-container {
            height: 80vh;
            width: 40vw;
            background-color: lightgray;
            text-align: center;
            padding: 5%;
            margin-top: 50px;
            margin-left: 400px;
        }

        button {

            background-color: white;
            padding: 10px;
            border-radius: 10px;
            width: 30%;
            height: 10%;
            font-size: 20px;
            display: flex;
            flex-wrap: wrap;

        }

        input {
            width: 90%;
            height: 10%;
            padding: 10px;
            border-radius: 10px;
            font-size: 20px;
        }

        #demo {
            width: 92%;
            height: 20%;
            padding: 10px;
            border-radius: 20px;
            border-color: black;
            font-size: 20px;
            background-color: beige;

        }

        .btn {
            display: flex;
            flex-wrap: wrap;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="main-container">
        <h1>Comparison Operator</h1>
        <div id="demo"></div>
        <br />
        <!-- first input -->
        <label for="number"></label>
        <input type="number" id="Input-one" placeholder="Enter first number">
        <br />
        <br />
        <!-- second input -->
        <label for="number"></label>
        <input type="number" id="Input-two" placeholder="Enter second number">
        <br />
        <br />
        <!-- button -->
        <div class="btn">
            <button type="button" onclick="compare()">x>y</button>
        
            <button type="button" onclick="compare1()">x < y</button>

            <button type="button" onclick="compare2()">x>=y</button>

            <button type="button" onclick="compare3()">x<=y </button>

            <button type="button" onclick="compare4()">x==y</button>

            <button type="button" onclick="compare5()">x===y</button>

            <button type="button" onclick="compare6()">x!=y</button>

            <button type="button" onclick="compare7()">x!==y</button>
        </div>
    </div>
    <script>

        function compare() {
            let x = document.getElementById("Input-one").value;
            let y = document.getElementById("Input-two").value;
            let z = x > y;
            alert(z);
            document.getElementById("demo").innerHTML = z;
        }
        function compare1() {
            let x = document.getElementById("Input-one").value;
            let y = document.getElementById("Input-two").value;
            let z = x < y;
            alert(z);
            document.getElementById("demo").innerHTML = z;
        }
        function compare2() {
            let x = document.getElementById("Input-one").value;
            let y = document.getElementById("Input-two").value;
            let z = x >= y;
            alert(z);
            document.getElementById("demo").innerHTML = z;
        }
        function compare3() {
            let x = document.getElementById("Input-one").value;
            let y = document.getElementById("Input-two").value;
            let z = x <= y;
            alert(z);
            document.getElementById("demo").innerHTML = z;
        }
        function compare4() {
            let x = document.getElementById("Input-one").value;
            let y = document.getElementById("Input-two").value;
            let z = x == y;
            alert(z);
            document.getElementById("demo").innerHTML = z;
        }
        function compare5() {
            let x = document.getElementById("Input-one").value;
            let y = document.getElementById("Input-two").value;
            let z = x === y;
            alert(z);
            document.getElementById("demo").innerHTML = z;
        }
        function compare6() {
            let x = document.getElementById("Input-one").value;
            let y = document.getElementById("Input-two").value;
            let z = x != y;
            alert(z);
            document.getElementById("demo").innerHTML = z;
        }
        function compare7() {
            let x = document.getElementById("Input-one").value;
            let y = document.getElementById("Input-two").value;
            let z = x !== y;
            alert(z);
            document.getElementById("demo").innerHTML = z;
        }

    </script>
</body>

</html>
