<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add to number</title>
</head>
<body>
    <!-- Add to Number with Javascript -->
    <form>
        <p id="demo">Number</p>
        <br/>
        <button type="button" onclick="myFunction()">get number</button>
        
    </form>
</body>
<script>
 function myFunction(){
    let x = 10;
    let y = 20;
    let z = x + y;
    // Maths operators( + , - , * , /, % )
    document.getElementById('demo').innerHTML = z
 }
</script>
</html>
